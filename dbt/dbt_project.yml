name: vehicle_safety
version: "1.0.0"
profile: vehicle_safety

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  vehicle_safety:
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      +schema: GOLD
      +materialized: table
    ai:
      +schema: AI

vars:
  # Cortex embeddings need a Snowflake account with a payment method (trial accounts are blocked).
  # Turned on 20 Oct 2026 after the account got a payment method and the backfill ran.
  enable_embeddings: true
  embedding_model: snowflake-arctic-embed-l-v2.0

seeds:
  vehicle_safety:
    +schema: SILVER
