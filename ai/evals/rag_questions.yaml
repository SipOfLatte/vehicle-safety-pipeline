# RAG retrieval eval: 30 questions with known relevant documents.
#
# recall questions: written from one specific recall, in owner's words rather than the recall's.
#   relevant is one recall or a list; hit = any of them is in the top 5. A list means another
#   recall (often a re-recall of the same defect) answers the question equally well.
# complaint questions: about one vehicle, model year and component group with many complaints.
#   Hit = at least one top-5 document is a complaint about that vehicle, year and group, and,
#   when text_pattern is set, whose text matches it (case-insensitive regex).
#
# Drafted from the data on 20 Oct 2026 and reviewed by Hao the same day: r01, r02, r06, r08 and r09
# were reworded because they copied the recall's wording or got a detail wrong; r01, r02, r06, r08,
# r09, h03, h07 and h08 accept a second recall; c02 and c06 gained a text_pattern.

recall:
  - id: r01
    question: "Is there a recall on the 2020 BMW X3 about something in the cargo area coming loose in a crash?"
    relevant: [recall:24V764000, recall:24V534000]
    reviewed: true
  - id: r02
    question: "My 2021 Chevy Bolt already had the battery recall done. Is there a follow-up recall I still need?"
    relevant: [recall:24V481000, recall:24V812000]
    reviewed: true
  - id: r03
    question: "Have there been steering recalls on the Ford Transit Trail because of corrosion?"
    relevant: recall:24V542000
    reviewed: true
  - id: r04
    question: "Can the side airbags on a 2019 Honda Odyssey go off on their own?"
    relevant: recall:26V227000
    reviewed: true
  - id: r05
    question: "Is there a problem with the second row power seats on the 2026 Hyundai Ioniq 9 not detecting people?"
    relevant: recall:26V588000
    reviewed: true
  - id: r06
    question: "Is there a recall on the 2023 Jeep Grand Cherokee for the seat airbags not working properly?"
    relevant: [recall:24V897000, recall:26V328000]
    reviewed: true
  - id: r07
    question: "The backup camera on my 2019 Kia Sorento stops showing a picture after rain. Is that a known recall?"
    relevant: recall:23V639000
    reviewed: true
  - id: r08
    question: "My Ram 2500 is leaking transmission fluid in the engine bay. Is there a recall for that?"
    relevant: [recall:22V835000, recall:20V043000]
    reviewed: true
  - id: r09
    question: "My 2020 Subaru Outback suddenly lost power while driving. Is there a transmission recall?"
    relevant: [recall:22V485000, recall:21V955000]
    reviewed: true
  - id: r10
    question: "Can the rear axle shaft come out of the housing on a 2022 Toyota Tacoma?"
    relevant: recall:24V152000
    reviewed: true

complaint:
  - id: c01
    question: "What engine problems do owners report on the 2017 Ford Escape?"
    relevant: {make: FORD, model_family: ESCAPE, model_year: 2017, component_group: ENGINE}
    reviewed: true
  - id: c02
    question: "Do 2019 Jeep Cherokee owners complain about the transmission?"
    relevant: {make: JEEP, model_family: CHEROKEE, model_year: 2019, component_group: POWER TRAIN}
    text_pattern: "transmission|shift|gear"
    reviewed: true
  - id: c03
    question: "What steering issues have people had with the 2022 Honda Civic?"
    relevant: {make: HONDA, model_family: CIVIC, model_year: 2022, component_group: STEERING}
    reviewed: true
  - id: c04
    question: "Are there complaints about engine failure on the 2016 Kia Sorento?"
    relevant: {make: KIA, model_family: SORENTO, model_year: 2016, component_group: ENGINE}
    reviewed: true
  - id: c05
    question: "What brake problems do owners describe on the 2018 Ram 3500?"
    relevant: {make: RAM, model_family: "3500", model_year: 2018, component_group: SERVICE BRAKES}
    reviewed: true
  - id: c06
    question: "Do 2021 Tesla Model Y owners report phantom braking with Autopilot?"
    relevant: {make: TESLA, model_family: MODEL Y, model_year: 2021, component_group: DRIVER ASSISTANCE}
    text_pattern: "phantom"
    reviewed: true
  - id: c07
    question: "What do owners say about the engine on the 2017 Hyundai Santa Fe?"
    relevant: {make: HYUNDAI, model_family: SANTA FE, model_year: 2017, component_group: ENGINE}
    reviewed: true
  - id: c08
    question: "Are there engine complaints for the 2021 Chevrolet Silverado 1500?"
    relevant: {make: CHEVROLET, model_family: SILVERADO 1500, model_year: 2021, component_group: ENGINE}
    reviewed: true
  - id: c09
    question: "What windshield or visibility problems are reported on the 2020 Subaru Outback?"
    relevant: {make: SUBARU, model_family: OUTBACK, model_year: 2020, component_group: VISIBILITY}
    reviewed: true
  - id: c10
    question: "Do Fisker Ocean owners report brake problems?"
    relevant: {make: FISKER, model_family: OCEAN, model_year: 2023, component_group: SERVICE BRAKES}
    reviewed: true

