# RAG retrieval eval: 20 questions with known relevant documents.
#
# recall questions: written from one specific recall, in owner's words rather than the recall's.
#   Hit = that recall is in the top 5.
# complaint questions: about one vehicle, model year and component group with many complaints.
#   Hit = at least one top-5 document is a complaint about that vehicle, year and group.
#
# Drafted from the data on 20 Oct 2026; every question needs a human check before the score is reported.
# Set reviewed: true on each one you've checked.

