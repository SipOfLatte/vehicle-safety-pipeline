  - id: s39
    set: holdout
    question: "Which vehicle has the most complaints per owner in Australia?"
    answer_pattern: "australia"
    reviewed: false
  - id: s40
    set: holdout
    question: "What share of the 2020 Chevrolet Bolt's complaints are severe?"
    sql: |
      select severe_share from vehicle_complaint_summary
      where make = 'CHEVROLET' and model_family like 'BOLT%' and model_year = 2020
    reviewed: false
