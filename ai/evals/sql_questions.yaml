  - id: s30
    set: holdout
    question: "How many fire complaints were received about electrical systems in 2023?"
    sql: |
      select sum(fire_complaints) as fire_complaints from fct_complaints_monthly
      where component_group = 'ELECTRICAL SYSTEM' and month between '2023-01-01' and '2023-12-01'
    reviewed: false
  - id: s31
