  - id: s29
    set: holdout
    question: "Which model year of the Chevrolet Silverado 1500 has the most complaints?"
    sql: |
      select model_year, complaints from vehicle_complaint_summary
      where make = 'CHEVROLET' and model_family = 'SILVERADO 1500'
